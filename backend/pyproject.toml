[project]
name = "callscope-backend"
version = "0.1.0"
description = "CallScope 接口调用拓扑分析平台后端"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "networkx>=3.4,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python>=0.23,<0.26",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

